[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atx-factor"
version = "0.1.0"
description = "Polars-native cross-sectional equity research, backtesting, and mega-alpha admission"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nathan Tormaschy", email = "nathan.tormaschy@gmail.com" }]
dependencies = [
  "duckdb>=1.4,<2",
  "numpy>=2.0,<3",
  "polars[pyarrow]>=1.32,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
atx-factor = "atx_factor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atx_factor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

