[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "atx-impl-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "pandas>=2.2",
    "pyarrow>=18",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools]
packages = ["db"]

[tool.setuptools.package-data]
db = ["seeds/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["db/tests"]
addopts = "-q"
