[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "atx-impl-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "pandas>=2.2",
    "pyarrow>=18",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-xdist>=3", "filelock>=3"]

[tool.setuptools]
packages = ["db"]

[tool.setuptools.package-data]
db = ["seeds/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["db/tests"]
# -n auto: run across all cores via pytest-xdist. Each test uses an isolated
# per-test file DB and the schema template is shared behind a file lock, so the
# suite is process-safe. Override locally with `-n0` to force serial execution.
addopts = "-q -n auto"
